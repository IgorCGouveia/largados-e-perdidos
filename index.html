<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Largados & Perdidos · Protótipo</title>
  <meta name="description" content="Protótipo de alta fidelidade do sistema de achados e perdidos do Centro de Informática da UFPB.">
  <link rel="icon" href="assets/mascote.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="proto-bar">
    <div class="proto-brand">
      <img src="assets/mascote.webp" alt="" width="36" height="36">
      <div>
        <strong>Largados &amp; Perdidos</strong>
        <span>Protótipo de alta fidelidade · Marco II</span>
      </div>
    </div>
    <nav class="proto-modes" aria-label="Visão do protótipo">
      <a href="#/u/catalogo" data-mode-link="u">Usuário · celular</a>
      <a href="#/g/solicitacoes" data-mode-link="g">Gestor · computador</a>
    </nav>
    <div class="proto-tools">
      <button type="button" class="link-btn" data-action="toggle-map">Mapa de telas</button>
      <button type="button" class="link-btn" data-action="reset">Restaurar dados</button>
    </div>
  </header>

  <div class="proto-stage">
    <aside class="screen-map" id="screen-map" aria-label="Mapa de telas"></aside>
    <main class="device-wrap" id="device-wrap">
      <div class="device" id="device">
        <div class="device-chrome" id="device-chrome"></div>
        <div class="app" id="app" tabindex="-1"></div>
      </div>
    </main>
  </div>

  <div class="toast-zone" id="toasts" role="status" aria-live="polite"></div>
  <div class="modal-zone" id="modal"></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views-user.js"></script>
  <script src="js/views-manager.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
